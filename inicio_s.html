<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
     <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" >
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
         <div class="sesion">

                    <h2>
                        Iniciar  
                        <span>sesion</span>
                    </h2>

                    <p class="intro">
                        Completa el formulario y te responderemos
                        lo antes posible.
                    </p>


                    <form
                        class="sesion-form"
                        action="#"
                        method="POST"
                    >

                        <div class="sesion-row">

                            <div class="sesion-group">

                                <label for="nombre">
                                    Nombre completo
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Tu nombre"
                                    required
                                >

                            </div>


                            <div class="sesion-group">

                                <label for="telefono">
                                    Teléfono
                                </label>

                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    placeholder="Tu número"
                                >

                            </div>

                        </div>


                        <div class="sesion-group">

                            <label for="email">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="tu@correo.com"
                                required
                            >

                        </div>


                        <div class="sesion-group">

                            <label for="mensaje">
                                Mensaje
                            </label>

                            <textarea
                                id="mensaje"
                                name="mensaje"
                                rows="5"
                                placeholder="¿En qué podemos ayudarte?"
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary form-submit"
                        >

                            Enviar mensaje

                            <i data-lucide="arrow-right"></i>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>
</body>
</html>
