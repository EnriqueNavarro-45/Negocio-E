<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Gerardo Mayela | Frutas y Verduras Frescas</title>

    <meta
        name="description"
        content="Frutas y verduras frescas de la mejor calidad en Aguascalientes. Productos locales seleccionados diariamente."
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" >
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- === HERO ===-->
    <section class="hero" id="inicio">
        <div class="hero-decoration hero-decoration-1"></div>
        <div class="hero-decoration hero-decoration-2"></div>
        <div class="container hero-content">
            <div class="hero-text">
                <span class="eyebrow">
                    <i data-lucide="leaf"></i>
                    Frescura todos los días
                </span>
                <h1>
                    Lo más fresco,
                    <span>directo a tu mesa</span>
                </h1>
                <p>
                    Frutas y verduras de la mejor calidad, seleccionadas
                    cuidadosamente todos los días en San Gerardo Mayela.
                </p>
                <div class="hero-buttons">
                    <a href="Productos.html" class="btn btn-primary">
                        Explorar productos
                        <i data-lucide="arrow-right"></i>
                    </a>
                    <a href="login.html" class="btn btn-outline"> Iniciar sesión </a>
                </div>
                <div class="hero-features">
                    <div>
                        <strong>100%</strong>
                        <span>Frescura</span>
                    </div>
                    <div>
                        <strong>Diaria</strong>
                        <span>Selección</span>
                    </div>
                    <div>
                        <strong>Local</strong>
                        <span>Producto</span>
                    </div>
                </div>
            </div>
            <!-- HERO IMAGE -->
            <div class="hero-image-wrapper">
                <div class="hero-image-card">
                    <img
                        src="Imagenes/LogoFrut.jpg"
                        alt="San Gerardo Mayela - Frutas y verduras">
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
