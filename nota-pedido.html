<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nota de venta | San Gerardo Mayela</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 25px;

            background: #e9e9e9;

            color: #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .nota {

            width: 800px;

            max-width: 100%;

            margin: 0 auto;

            background: #fff;

            padding: 35px;

            border: 1px solid #222;

        }


        .nota-header {

            display: grid;

            grid-template-columns: 1fr 230px;

            gap: 25px;

            padding-bottom: 20px;

            border-bottom: 2px solid #222;

        }


        .empresa h1 {

            margin: 0 0 5px;

            font-size: 25px;

            text-transform: uppercase;

        }


        .empresa p {

            margin: 3px 0;

            font-size: 12px;

        }


        .titulo-nota {

            text-align: right;

        }


        .titulo-nota h2 {

            margin: 0 0 12px;

            font-size: 20px;

            text-transform: uppercase;

        }


        .numero-pedido {

            border: 1px solid #222;

            padding: 8px;

            font-size: 13px;

        }


        .datos {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            padding: 20px 0;

        }


        .dato-bloque {

            font-size: 12px;

            line-height: 1.6;

        }


        .dato-bloque strong {

            display: block;

            margin-bottom: 3px;

            font-size: 11px;

            text-transform: uppercase;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 5px;

            font-size: 12px;

        }


        th {

            background: #eeeeee;

            border: 1px solid #222;

            padding: 8px;

            text-align: left;

            text-transform: uppercase;

        }


        td {

            border: 1px solid #222;

            padding: 8px;

        }


        th:nth-child(1),
        td:nth-child(1) {

            width: 12%;

            text-align: center;

        }


        th:nth-child(3),
        td:nth-child(3) {

            width: 15%;

            text-align: center;

        }


        th:nth-child(4),
        td:nth-child(4) {

            width: 20%;

            text-align: right;

        }


        .total-container {

            display: flex;

            justify-content: flex-end;

            margin-top: 18px;

        }


        .total {

            width: 260px;

            border: 1px solid #222;

        }


        .total-row {

            display: flex;

            justify-content: space-between;

            padding: 10px 12px;

        }


        .total-row strong {

            font-size: 16px;

        }


        .nota-footer {

            margin-top: 35px;

            padding-top: 15px;

            border-top: 1px solid #222;

            text-align: center;

            font-size: 11px;

            line-height: 1.5;

        }


        .acciones {

            width: 800px;

            max-width: 100%;

            margin: 15px auto;

            display: flex;

            justify-content: flex-end;

            gap: 10px;

        }


        .acciones button {

            padding: 10px 16px;

            border: 0;

            border-radius: 6px;

            background: #2e7d32;

            color: white;

            font-weight: 600;

            cursor: pointer;

        }


        .error {

            width: 800px;

            max-width: 100%;

            margin: 50px auto;

            padding: 30px;

            background: #fff;

            border: 1px solid #ccc;

            text-align: center;

        }


        @media print {

            @page {

                size: letter;

                margin: 10mm;

            }


            body {

                padding: 0;

                background: white;

            }


            .nota {

                width: 100%;

                border: 0;

                padding: 0;

            }


            .acciones {

                display: none;

            }

        }


        @media (max-width: 600px) {

            body {

                padding: 10px;

            }


            .nota-header {

                grid-template-columns: 1fr;

            }


            .titulo-nota {

                text-align: left;

            }


            .datos {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <div id="contenido-nota"></div>


    <div class="acciones">

        <button
            type="button"
            onclick="window.print()"
        >
            Imprimir nota
        </button>

        <button
            type="button"
            onclick="window.close()"
        >
            Cerrar
        </button>

    </div>


<script>

    const contenedor =
        document.getElementById(
            "contenido-nota"
        );


    function obtenerIdPedido() {

        const parametros =
            new URLSearchParams(
                window.location.search
            );

        return parametros.get("id");

    }


    function obtenerPedidos() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "pedidosSanGerardo"
                ) || "[]"
            );

        } catch (error) {

            return [];

        }

    }


    function mostrarNota() {

        const id =
            obtenerIdPedido();


        const pedidos =
            obtenerPedidos();


        const pedido =
            pedidos.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!pedido) {

            contenedor.innerHTML = `

                <div class="error">

                    <h2>
                        Pedido no encontrado
                    </h2>

                    <p>
                        No fue posible encontrar
                        el pedido solicitado.
                    </p>

                </div>

            `;

            return;

        }


        contenedor.innerHTML = `

            <main class="nota">


                <header class="nota-header">


                    <div class="empresa">

                        <h1>
                            San Gerardo Mayela
                        </h1>

                        <p>
                            Frutas y Verduras Frescas
                        </p>

                        <p>
                            Corregidora 809,
                            Morelos I
                        </p>

                        <p>
                            20298 Aguascalientes, Ags.
                        </p>

                        <p>
                            Tel. +52 449 257 8963
                        </p>

                        <p>
                            sangerardomayela@gmail.com
                        </p>

                    </div>


                    <div class="titulo-nota">

                        <h2>
                            Nota de venta
                        </h2>

                        <div class="numero-pedido">

                            <strong>
                                Pedido:
                            </strong>

                            #${pedido.id}

                        </div>

                        <p>
                            Fecha:
                            ${pedido.fecha}
                        </p>

                        <p>
                            Hora:
                            ${pedido.hora}
                        </p>

                    </div>


                </header>


                <section class="datos">


                    <div class="dato-bloque">

                        <strong>
                            Cliente
                        </strong>

                        ${pedido.nombreCliente}

                    </div>


                    <div class="dato-bloque">

                        <strong>
                            Teléfono
                        </strong>

                        ${pedido.telefono}

                    </div>


                    <div class="dato-bloque">

                        <strong>
                            Correo electrónico
                        </strong>

                        ${pedido.usuario}

                    </div>


                    <div class="dato-bloque">

                        <strong>
                            Estado del pedido
                        </strong>

                        ${pedido.estado}

                    </div>


                    <div
                        class="dato-bloque"
                        style="grid-column: 1 / -1;"
                    >

                        <strong>
                            Dirección de entrega
                        </strong>

                        ${pedido.direccionEntrega}

                    </div>


                </section>


                <table>

                    <thead>

                        <tr>

                            <th>
                                Cant.
                            </th>

                            <th>
                                Descripción
                            </th>

                            <th>
                                Unidad
                            </th>

                            <th>
                                Total
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${pedido.productos.map(producto => `

                            <tr>

                                <td>
                                    ${producto.cantidad}
                                </td>

                                <td>
                                    ${producto.producto}
                                </td>

                                <td>
                                    ${producto.unidad}
                                </td>

                                <td>
                                    $${Number(producto.subtotal).toFixed(2)}
                                </td>

                            </tr>

                        `).join("")}


                    </tbody>

                </table>


                <div class="total-container">

                    <div class="total">

                        <div class="total-row">

                            <span>
                                TOTAL
                            </span>

                            <strong>
                                $${Number(pedido.total).toFixed(2)}
                                MXN
                            </strong>

                        </div>

                    </div>

                </div>


                <footer class="nota-footer">

                    <strong>
                        Gracias por su compra
                    </strong>

                    <br>

                    San Gerardo Mayela
                    · Frutas y verduras frescas

                    <br>

                    Esta nota corresponde a una
                    simulación de pedido del sitio web.

                </footer>


            </main>

        `;

    }


    document.addEventListener(
        "DOMContentLoaded",
        mostrarNota
    );

</script>

</body>

</html>
