<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | San Gerardo Mayela</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <img src="Imagenes/LogoFrut.jpg" alt="San Gerardo Mayela">
            </div>

            <h1>Bienvenido</h1>

            <p class="login-subtitle">
                Inicia sesión para continuar
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">Correo electrónico</label>

                    <div class="input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">Contraseña</label>

                    <div class="input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                        </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            aria-label="Mostrar contraseña"
                        >

                            <svg viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>

                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Recordarme</span>
                    </label>

                    <a href="#" id="forgotPassword">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit" class="login-button">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14H5c-1.1 0-2 .9-2 2v3h2V5h14v14H5v-3H3v3c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                    </svg>

                    Iniciar sesión

                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>


            <div class="login-divider">
                <span>San Gerardo Mayela</span>
            </div>


            <a href="index.html" class="back-home">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>

                Regresar al inicio

            </a>
            
<div class="registro-link">

    <span>¿No tienes una cuenta?</span>

    <a href="registro.html">
        Crear una cuenta
    </a>

</div>
        </section>

    </main>


    <script>

        const loginForm = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const loginMessage = document.getElementById("loginMessage");

        const showPassword = document.getElementById("showPassword");


        /* Mostrar / ocultar contraseña */

        showPassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        });


        /* Simulación del inicio de sesión */

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            if (email.value.trim() === "" || password.value.trim() === "") {

                loginMessage.textContent = "Completa todos los campos.";
                loginMessage.className = "login-message error";

                return;

            }


            loginMessage.textContent = "Iniciando sesión...";
            loginMessage.className = "login-message success";


            setTimeout(function () {

                sessionStorage.setItem("sesionActiva", "true");
                sessionStorage.setItem("usuario", email.value);

                window.location.href = "Productos.html";

            }, 1200);

        });


        /* Simulación de recuperar contraseña */

        document.getElementById("forgotPassword").addEventListener("click", function (event) {

            event.preventDefault();

            alert("Esta función es únicamente una simulación.");

        });

    </script>

</body>
</html>
