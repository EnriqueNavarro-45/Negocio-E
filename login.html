<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | San Gerardo Mayela</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #f0f7f0 0%, #e8f5e9 40%, #fff8e7 100%);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 36px 32px;
            box-shadow: 0 20px 60px rgba(46, 125, 50, 0.12);
            text-align: center;
        }

        .login-logo img {
            width: 88px;
            height: 88px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #e8f5e9;
            margin-bottom: 16px;
        }

        .login-card h1 {
            margin: 0 0 6px;
            font-size: 1.75rem;
            font-weight: 700;
            color: #1b5e20;
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: #6b7c6b;
            font-size: 0.95rem;
        }

        .acceso-rapido {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .btn-acceso {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-acceso:hover {
            transform: translateY(-2px);
        }

        .btn-acceso:active {
            transform: translateY(0);
        }

        .btn-acceso svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-acceso-usuario {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: #fff;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.35);
        }

        .btn-acceso-usuario:hover {
            box-shadow: 0 12px 28px rgba(46, 125, 50, 0.45);
        }

        .btn-acceso-admin {
            background: linear-gradient(135deg, #37474f, #263238);
            color: #fff;
            box-shadow: 0 8px 24px rgba(38, 50, 56, 0.35);
        }

        .btn-acceso-admin:hover {
            box-shadow: 0 12px 28px rgba(38, 50, 56, 0.45);
        }

        .btn-acceso small {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 2px;
        }

        .btn-acceso-texto {
            text-align: left;
            line-height: 1.25;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 20px;
            color: #a0aea0;
            font-size: 0.8rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e8e0;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .back-home svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .login-links a {
            color: #6b7c6b;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .login-links a:hover {
            color: #2e7d32;
        }

        .login-note {
            margin-top: 20px;
            padding: 12px 14px;
            background: #f5faf5;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #5a6b5a;
            line-height: 1.45;
        }
    </style>
</head>

<body class="login-body">

    <main class="login-container">
        <section class="login-card">

            <div class="login-logo">
                <img src="Imagenes/LogoFrut.jpg" alt="San Gerardo Mayela">
            </div>

            <h1>Bienvenido</h1>
            <p class="login-subtitle">Elige cómo deseas ingresar</p>

            <div class="acceso-rapido">
                <button type="button" class="btn-acceso btn-acceso-usuario" id="btn-usuario">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span class="btn-acceso-texto">
                        Acceder como Usuario
                        <small>Catálogo, carrito y compras</small>
                    </span>
                </button>

                <button type="button" class="btn-acceso btn-acceso-admin" id="btn-admin">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                    <span class="btn-acceso-texto">
                        Acceder como Administrador
                        <small>Inventario, ofertas y pedidos</small>
                    </span>
                </button>
            </div>

            <div class="login-divider">
                <span>San Gerardo Mayela</span>
            </div>

            <a href="index.html" class="back-home">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Regresar al inicio
            </a>

            <div class="login-links">
                <a href="Productos.html">Continuar como visitante</a>
            </div>

            <div class="login-note">
                Acceso de demostración: no se pide correo ni contraseña.
                El usuario va al catálogo; el administrador al panel de control.
            </div>

        </section>
    </main>

    <script>
        /* Si ya hay sesión, redirigir según el rol */
        if (sessionStorage.getItem('sesionActiva') === 'true') {
            window.location.href =
                sessionStorage.getItem('rol') === 'administrador'
                    ? 'admin.html'
                    : 'Productos.html';
        }

        function iniciarSesion(rol, nombre, correo) {
            sessionStorage.setItem('sesionActiva', 'true');
            sessionStorage.setItem('rol', rol);
            sessionStorage.setItem('nombre', nombre);
            sessionStorage.setItem('usuario', correo);
            window.location.href = rol === 'administrador' ? 'admin.html' : 'Productos.html';
        }

        document.getElementById('btn-usuario').addEventListener('click', function () {
            iniciarSesion('cliente', 'Cliente demo', 'cliente@sangerardomayela.com');
        });

        document.getElementById('btn-admin').addEventListener('click', function () {
            iniciarSesion('administrador', 'Administrador', 'admin@sangerardomayela.com');
        });
    </script>

</body>
</html>
