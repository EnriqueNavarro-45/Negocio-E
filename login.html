<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | San Gerardo Mayela</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-body">


    <main class="login-container">


        <section class="login-card">


            <!-- =====================================================
                 LOGO
            ====================================================== -->

            <div class="login-logo">

                <img
                    src="Imagenes/LogoFrut.jpg"
                    alt="San Gerardo Mayela"
                >

            </div>


            <!-- =====================================================
                 ENCABEZADO
            ====================================================== -->

            <div class="login-header">

                <span class="section-tag">
                    Bienvenido
                </span>

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Accede a tu cuenta para disfrutar de nuestros productos.
                </p>

            </div>


            <!-- =====================================================
                 FORMULARIO
            ====================================================== -->

            <form id="loginForm">


                <!-- CORREO -->

                <div class="login-input-group">

                    <label for="email">
                        Correo electrónico
                    </label>


                    <div class="login-input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>

                        </svg>


                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="login-input-group">

                    <label for="password">
                        Contraseña
                    </label>


                    <div class="login-input-wrapper">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-0.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>

                        </svg>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                        >

                    </div>

                </div>


                <!-- OLVIDASTE CONTRASEÑA -->

                <div class="login-extra">

                    <a
                        href="#"
                        id="olvidaste-password"
                    >
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- =================================================
                     BOTÓN NORMAL
                ================================================== -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14h-8v2h8v14h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>

                    </svg>

                    Iniciar sesión

                </button>


            </form>


            <!-- MENSAJE -->

            <div
                id="login-mensaje"
                class="login-mensaje"
                aria-live="polite"
            ></div>


            <!-- =====================================================
                 SEPARADOR
            ====================================================== -->

            <div class="login-divider">

                <span>
                    o
                </span>

            </div>


            <!-- =====================================================
                 ADMINISTRADOR
            ====================================================== -->

            <button
                type="button"
                class="login-admin-btn"
                id="btn-administrador"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10h7c-.53 4.12-3.28 7.79-7 8.94V11H5V6.3l7-3.11V11z"/>

                </svg>

                Acceder como administrador

            </button>


            <p class="login-admin-nota">
                Acceso de demostración para el panel de administración.
            </p>


            <!-- =====================================================
                 REGISTRO
            ====================================================== -->

            <div class="login-registro">

                <p>
                    ¿No tienes una cuenta?
                </p>

                <a href="registro.html">
                    Crear una cuenta
                </a>

            </div>


            <!-- =====================================================
                 REGRESAR
            ====================================================== -->

            <a
                href="index.html"
                class="login-volver"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>

                </svg>

                Regresar al inicio

            </a>


        </section>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        /*
         * IMPORTANTE:
         *
         * Este login es solamente una simulación.
         *
         * NO SE VALIDAN:
         * - Correo
         * - Contraseña
         * - Campos vacíos
         * - Existencia del usuario
         *
         * Se puede iniciar sesión incluso dejando
         * todos los campos completamente vacíos.
         */


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const email =
            document.getElementById(
                "email"
            );


        const loginMensaje =
            document.getElementById(
                "login-mensaje"
            );


        const olvidastePassword =
            document.getElementById(
                "olvidaste-password"
            );


        const btnAdministrador =
            document.getElementById(
                "btn-administrador"
            );


        /* =====================================================
           INICIAR COMO CLIENTE
        ====================================================== */

        loginForm.addEventListener(
            "submit",
            function(event) {

                /*
                 * Evita que el navegador recargue
                 * la página.
                 */

                event.preventDefault();


                /*
                 * No hacemos ninguna validación.
                 *
                 * Si el correo está vacío, se guarda vacío.
                 * Si el usuario escribió algo, se guarda.
                 */

                const correo =
                    email.value.trim();


                /*
                 * Crear sesión como CLIENTE.
                 */

                sessionStorage.setItem(
                    "sesionActiva",
                    "true"
                );


                sessionStorage.setItem(
                    "rol",
                    "cliente"
                );


                sessionStorage.setItem(
                    "usuario",
                    correo
                );


                sessionStorage.setItem(
                    "nombre",
                    correo || "Cliente"
                );


                /*
                 * Si ya existen datos del perfil
                 * provenientes del registro, los conservamos.
                 *
                 * No creamos datos nuevos obligatorios.
                 */

                if (
                    !sessionStorage.getItem(
                        "datosPerfil"
                    )
                ) {

                    const datosPerfil = {

                        nombre:
                            "Cliente",

                        apellido:
                            "",

                        correo:
                            correo,

                        telefono:
                            "",

                        direccion:
                            "",

                        rol:
                            "cliente"

                    };


                    sessionStorage.setItem(
                        "datosPerfil",
                        JSON.stringify(
                            datosPerfil
                        )
                    );

                }


                /*
                 * Entrar directamente a la tienda.
                 */

                window.location.href =
                    "Productos.html";

            }
        );


        /* =====================================================
           ENTRAR COMO ADMINISTRADOR
        ====================================================== */

        btnAdministrador.addEventListener(
            "click",
            function() {


                /*
                 * No pide correo.
                 *
                 * No pide contraseña.
                 *
                 * No pide ningún campo.
                 */


                sessionStorage.setItem(
                    "sesionActiva",
                    "true"
                );


                sessionStorage.setItem(
                    "rol",
                    "administrador"
                );


                sessionStorage.setItem(
                    "usuario",
                    "admin@sangerardomayela.com"
                );


                sessionStorage.setItem(
                    "nombre",
                    "Administrador"
                );


                /*
                 * Crear datos básicos del administrador.
                 */

                const datosPerfil = {

                    nombre:
                        "Administrador",

                    apellido:
                        "",

                    correo:
                        "admin@sangerardomayela.com",

                    telefono:
                        "",

                    direccion:
                        "",

                    rol:
                        "administrador"

                };


                sessionStorage.setItem(
                    "datosPerfil",
                    JSON.stringify(
                        datosPerfil
                    )
                );


                /*
                 * Ir directamente al panel.
                 */

                window.location.href =
                    "admin.html";

            }
        );


        /* =====================================================
           OLVIDASTE TU CONTRASEÑA
        ====================================================== */

        olvidastePassword.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                loginMensaje.textContent =
                    "La recuperación de contraseña es una función de demostración.";


                loginMensaje.classList.add(
                    "visible"
                );

            }
        );

    </script>


</body>

</html>
