<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | San Gerardo Mayela</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="registro-body">

    <main class="registro-container">

        <section class="registro-card">

            <!-- Logo -->

            <div class="registro-logo">
                <img src="Imagenes/LogoFrut.jpg" alt="San Gerardo Mayela">
            </div>


            <!-- Encabezado -->

            <div class="registro-header">

                <h1>Crear una cuenta</h1>

                <p>
                    Regístrate para disfrutar de nuestros productos.
                </p>

            </div>


            <!-- Formulario -->

            <form id="registroForm">


                <!-- Nombre y apellido -->

                <div class="registro-row">

                    <div class="registro-input-group">

                        <label for="nombre">
                            Nombre
                        </label>

                        <div class="registro-input-wrapper">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>

                            <input
                                type="text"
                                id="nombre"
                                placeholder="Tu nombre"
                                required
                            >

                        </div>

                    </div>


                    <div class="registro-input-group">

                        <label for="apellido">
                            Apellido
                        </label>

                        <div class="registro-input-wrapper">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>

                            <input
                                type="text"
                                id="apellido"
                                placeholder="Tu apellido"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- Correo -->

                <div class="registro-input-group">

                    <label for="registroEmail">
                        Correo electrónico
                    </label>

                    <div class="registro-input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>

                        <input
                            type="email"
                            id="registroEmail"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>

                </div>


                <!-- Teléfono -->

                <div class="registro-input-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <div class="registro-input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>

                        <input
                            type="tel"
                            id="telefono"
                            placeholder="449 000 0000"
                            required
                        >

                    </div>

                </div>


                <!-- Contraseña -->

                <div class="registro-input-group">

                    <label for="registroPassword">
                        Contraseña
                    </label>

                    <div class="registro-input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                        </svg>

                        <input
                            type="password"
                            id="registroPassword"
                            placeholder="Crea una contraseña"
                            required
                        >

                        <button
                            type="button"
                            class="registro-show-password"
                            id="showRegistroPassword"
                            aria-label="Mostrar contraseña"
                        >

                            <svg viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>

                        </button>

                    </div>

                    <small>
                        La contraseña debe tener al menos 6 caracteres.
                    </small>

                </div>


                <!-- Confirmar contraseña -->

                <div class="registro-input-group">

                    <label for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <div class="registro-input-wrapper">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
                        </svg>

                        <input
                            type="password"
                            id="confirmarPassword"
                            placeholder="Repite tu contraseña"
                            required
                        >

                    </div>

                </div>


                <!-- Términos -->

                <label class="registro-terminos">

                    <input
                        type="checkbox"
                        id="terminos"
                        required
                    >

                    <span>
                        Acepto los términos y condiciones de uso.
                    </span>

                </label>


                <!-- Mensaje -->

                <p id="registroMessage" class="registro-message"></p>


                <!-- Botón -->

                <button
                    type="submit"
                    class="registro-button"
                >

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>

                    Crear cuenta

                </button>

            </form>


            <!-- Login -->

            <div class="registro-login">

                <span>
                    ¿Ya tienes una cuenta?
                </span>

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>


            <!-- Regresar -->

            <a href="index.html" class="registro-back">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>

                Regresar al inicio

            </a>

        </section>

    </main>


    <script>

        const registroForm = document.getElementById("registroForm");

        const password = document.getElementById("registroPassword");

        const confirmarPassword = document.getElementById("confirmarPassword");

        const message = document.getElementById("registroMessage");

        const showPassword = document.getElementById("showRegistroPassword");


        /* Mostrar / ocultar contraseña */

        showPassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                confirmarPassword.type = "text";

            } else {

                password.type = "password";
                confirmarPassword.type = "password";

            }

        });


        /* Registro simulado */

        registroForm.addEventListener("submit", function(event) {

            event.preventDefault();


            if (password.value.length < 6) {

                message.textContent =
                    "La contraseña debe tener al menos 6 caracteres.";

                message.className = "registro-message error";

                return;

            }


            if (password.value !== confirmarPassword.value) {

                message.textContent =
                    "Las contraseñas no coinciden.";

                message.className = "registro-message error";

                return;

            }


            message.textContent =
                "Cuenta creada correctamente. Redirigiendo...";

            message.className = "registro-message success";


            setTimeout(function() {

                window.location.href = "login.html";

            }, 1500);

        });

    </script>

</body>
</html>
